[project]
name = "ku-agent-demo"
version = "0.1.0"
description = "Tiny FastAPI service used as the demo target for ku coding agents"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
